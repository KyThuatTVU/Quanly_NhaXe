<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách xe</title>
    <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div id="site-header"></div>

<main class="site-main">
    <section class="section">
        <div class="container">
            <h1>Danh sách xe</h1>
            <p class="muted">Xe đang sẵn sàng phục vụ, giá tính theo ngày và số km thực tế.</p>

            <form class="form-card" id="filter-form" style="margin:18px 0">
                <div class="form-grid">
                    <label class="field">
                        <span>Dòng xe</span>
                        <select name="vehicle_type_id" id="type-filter">
                            <option value="">Tất cả dòng xe</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Tìm kiếm</span>
                        <input type="search" name="search" id="search-input" placeholder="Tên xe, mô tả...">
                    </label>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Lọc xe</button>
                    <a class="btn btn-outline" href="./">Xoá lọc</a>
                </div>
            </form>

            <div id="page-alert" class="alert-slot"></div>
            <div class="grid grid-3" id="vehicle-grid" style="margin-top:16px"></div>
        </div>
    </section>
</main>

<div id="site-footer"></div>
<script type="module" src="../assets/js/pages/cars.js"></script>
</body>
</html>
