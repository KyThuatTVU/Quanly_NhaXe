<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tra cứu đơn — Xe Hợp Đồng Tháo Vy</title>
    <link rel="stylesheet" href="../../../assets/css/app.css">
</head>
<body>
<div id="site-header"></div>

<main class="site-main">
    <section class="section">
        <div class="container">
            <h1>Tra cứu đơn đặt xe</h1>
            <p class="muted">Nhập mã đơn và số điện thoại đã dùng khi đặt xe.</p>
            <div id="page-alert" class="alert-slot"></div>

            <form class="form-card" id="lookup-form" style="margin-top:18px;max-width:640px" novalidate>
                <div class="form-grid">
                    <label class="field">
                        <span>Mã đơn *</span>
                        <input type="text" name="code" placeholder="Ví dụ: TV2611150001" required>
                    </label>
                    <label class="field">
                        <span>Số điện thoại *</span>
                        <input type="tel" name="phone" placeholder="Ví dụ: 0912345678" required>
                    </label>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit" id="lookup-btn">Tra cứu</button>
                </div>
            </form>

            <div id="lookup-result" style="margin-top:24px"></div>
        </div>
    </section>
</main>

<div id="site-footer"></div>
<script type="module" src="../../../assets/js/pages/lookup.js"></script>
</body>
</html>
